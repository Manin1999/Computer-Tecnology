<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Computer Technology - Acceso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Logo superior -->
    <div class="top-logo">
        <img src="gta22.png" alt="Logo Computer Technology" class="top-logo-img">
        <h1 class="top-logo-text">COMPUTER TECHNOLOGY</h1>
    </div>

    <!-- Contenedor principal -->
    <div class="main-container">
        
        <!-- Pestañas de navegación -->
        <div class="tabs">
            <button class="tab-btn active" id="tabLoginBtn">Iniciar Sesión</button>
            <button class="tab-btn" id="tabRegisterBtn">Registrarse</button>
        </div>

        <!-- Formulario de Inicio de Sesión -->
        <div class="form-wrapper active" id="loginWrapper">
            <form id="loginForm">
                <h2>Bienvenido</h2>
                <p class="form-subtitle">Ingresa sus datos personales para ingresar en Computer Technology</p>
                
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="loginEmail" placeholder="ejemplo@gmail.com" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary" id="loginSubmit">INGRESAR</button>
                <div id="loginMessage" class="message-area"></div>
            </form>
        </div>

        <!-- Formulario de Registro -->
        <div class="form-wrapper" id="registerWrapper">
            <form id="registerForm">
                <h2>Crear cuenta</h2>
                <p class="form-subtitle">use su correo electronico para registrarse en la mejor tienda de tecnologia a nivel mundial</p>
                
                <div class="input-group">
                    <label>Nombre completo</label>
                    <input type="text" id="regNombre" placeholder="Tu nombre" required>
                </div>
                
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="regEmail" placeholder="ejemplo@gmail.com" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary" id="registerSubmit">REGISTRARSE</button>
                <div id="registerMessage" class="message-area"></div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
