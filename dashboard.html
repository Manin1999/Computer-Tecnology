<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Computer Technology - Inicio</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <!-- Header estilo Mercado Libre -->
    <header class="ml-header">
        <div class="header-top">
            <div class="logo-area">
                <img src="gta22.png" alt="Logo" class="header-logo">
                <span class="logo-text">Computer <span class="tech">Technology</span></span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar productos, marcas y más..." class="search-input">
                <button id="searchBtn" class="search-btn">🔍</button>
            </div>
            <div class="cart-icon" id="cartIcon">
                🛒
                <span id="cartCount" class="cart-badge">0</span>
            </div>
        </div>
        <div class="header-bottom">
            <div class="categories" id="categories">
                <span class="category active" data-cat="all">Todos</span>
                <span class="category" data-cat="laptops">💻 Laptops</span>
                <span class="category" data-cat="perifericos">🎮 Periféricos</span>
                <span class="category" data-cat="monitores">🖥️ Monitores</span>
                <span class="category" data-cat="almacenamiento">💾 Almacenamiento</span>
                <span class="category" data-cat="audio">🎧 Audio</span>
            </div>
        </div>
    </header>

    <!-- Usuario bienvenida -->
    <div class="user-greeting">
        <div class="greeting-content">
            <span class="greeting-icon">👋</span>
            <span id="welcomeText" class="greeting-text"></span>
        </div>
    </div>

    <!-- Productos -->
    <main class="ml-main">
        <div class="products-grid" id="productsGrid">
            <!-- Productos cargados con JS -->
        </div>
    </main>

    <!-- Carrito lateral (slide) -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Mi Carrito</h3>
            <button class="close-cart" id="closeCartBtn">✕</button>
        </div>
        <div class="cart-body" id="cartBody">
            <div class="empty-cart-message">
                <span class="empty-icon">🛒</span>
                <p>Tu carrito está vacío</p>
                <small>¡Agrega productos para continuar!</small>
            </div>
        </div>
        <div class="cart-footer" id="cartFooter" style="display: none;">
            <div class="cart-total">
                <span>Total:</span>
                <strong id="cartTotal">$0</strong>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Comprar ahora</button>
        </div>
    </div>

    <!-- Overlay para el carrito -->
    <div id="overlay" class="overlay"></div>

    <!-- Modal de compra exitosa -->
    <div id="successModal" class="modal">
        <div class="modal-content success-modal">
            <div class="success-icon">✅</div>
            <h2>¡Compra realizada con éxito!</h2>
            <p>Tu pedido está siendo procesado. Recibirás un correo con los detalles.</p>
            <button class="continue-btn" id="continueBtn">Seguir comprando</button>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
